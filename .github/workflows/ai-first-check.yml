name: ai-first-check

# AI-first 文档约定合规检查：约定靠工具传播，而非靠口头提醒。
# 任何 PR/push 破坏了 AI 入口结构（文件缺失、死链、知识浓缩退化）都会导致 CI 失败。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AI-first convention check
        run: bash scripts/ai-first-check.sh .
